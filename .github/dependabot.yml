version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait a week before suggesting a new version. Most malicious releases are
    # found and removed within days. minimumReleaseAge in bunfig.toml uses the
    # same wait for bun add and bun update, so change both together.
    cooldown:
      default-days: 7
    groups:
      opentui:
        patterns: ["@opentui/*"]
    # "build(deps): bump ...", as AGENTS.md asks. No changelog line.
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # "ci(deps): bump ...", as AGENTS.md asks. No changelog line.
    commit-message:
      prefix: ci
      include: scope
