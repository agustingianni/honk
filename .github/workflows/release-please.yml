# Keeps one release PR open, "chore(main): release X.Y.Z", with the next version
# and its CHANGELOG.md section, built from the commit messages (see AGENTS.md).
#
# Merging that PR makes the tag and a draft GitHub release. The jobs after it
# build the binaries, test them on Linux, sign them, attach them to the draft,
# and publish it. A draft is hidden from install.sh and from honk's update
# check, so nobody sees a release before its binaries are there, or one whose
# tests failed.
#
# The jobs run here, not in a workflow started by the tag: a tag made with the
# default GITHUB_TOKEN starts no other workflow (GitHub's rule against loops).
# The release PR is made with that token too, so its CI runs wait for
# approval ("Approve workflows to run"). They are optional: the PR only
# changes CHANGELOG.md and the version, and the jobs below check the build.
name: release-please
on:
  push:
    branches: [main]

permissions: {}

# Two pushes close together must not both edit the release PR or both release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Update the release PR, or release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release PR's branch; make the tag and the draft release
      pull-requests: write # open and update the release PR
      issues: write # label the release PR ("autorelease: pending")
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Runs third-party code (packages, the compiler), so it gets read access only.
  build:
    name: Build binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true # do not reuse a cached Bun download in a release
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run release
        env:
          HONK_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/honk-*.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # already gzipped

  # Installs and runs the Linux binaries in Docker on several distros, each CPU
  # on its own runner. The release is only published if every combination passes.
  test:
    name: Test on Linux (${{ matrix.platform }})
    needs: [release-please, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the test scripts and install.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - run: sh scripts/test-linux.sh
        env:
          HONK_TEST_PLATFORMS: ${{ matrix.platform }}

  # Runs no third-party build code. It signs the binaries, attaches them to the
  # draft release, and publishes it.
  publish:
    name: Attest and publish
    needs: [release-please, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the binaries and publish the release
      id-token: write # get the OIDC token that signs the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # Unpack a copy of each binary, so the attestation covers both the .gz
      # files and the installed binaries (gh attestation verify ~/.local/bin/honk).
      - run: gzip -dk dist/honk-*.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/honk-*
      # install.sh checks each download against this file.
      - run: cd dist && sha256sum honk-*.gz > SHA256SUMS
      - run: |
          gh release upload "$TAG" dist/honk-*.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
