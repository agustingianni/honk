# release-please reads commit subjects to write the changelog. See AGENTS.md.
# Apart from ci.yml, so that editing a PR title runs only this check.
name: commits
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the code and its history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commits to check, and the one before them
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      # A pull request is squash merged, and its title becomes the commit message.
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/check-commits.ts --title "$TITLE"
      # A push: only the commits it added. A push that creates a branch has no
      # "before" (all zeros), so check its last commit.
      - if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$BEFORE" in 0000000000000000000000000000000000000000) BEFORE="$AFTER~1" ;; esac
          bun scripts/check-commits.ts "$BEFORE..$AFTER"
