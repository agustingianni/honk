# Settings for `bun install` and `bun add` in this repo. The honk binary never
# reads this file: it is built with --no-compile-autoload-bunfig.
[install]
# Do not install a version published less than 7 days ago, the same wait as
# the Dependabot cooldown in .github/dependabot.yml.
minimumReleaseAge = 604800 # seconds
# Without node_modules, Bun would fetch imports on the fly. Fail with "Cannot
# find module" instead, so every install goes through bun install and bun.lock.
auto = "disable"
